name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"  # toutes les 24h
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ny-antsaniaina
          outputs: dist/snake.svg
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}  # ton token ici

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
